name: Cleaner
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  CleanerKit:
    path: Packages/CleanerKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly: XcodeGen does not commit a Package.resolved for the generated (ignored)
    # project, so the version is fixed here. Bump deliberately and re-test updates.
    exactVersion: 2.10.1
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.prabhatkumar.Cleaner
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    CODE_SIGN_STYLE: Automatic
    # Entitlements (App Group, widget sandbox) need a real certificate and team, so they are off
    # for ad-hoc builds. `make build-signed` and scripts/release.sh point these at
    # Config/*.entitlements. The App Group is Team-ID-prefixed
    # ($(TeamIdentifierPrefix)com.prabhatkumar.Cleaner), which Developer ID builds can use
    # without a provisioning profile; both targets read the resolved id from the
    # CleanerAppGroup Info.plist key.
    CLEANER_APP_ENTITLEMENTS: ""
    CLEANER_WIDGET_ENTITLEMENTS: ""
    # Set by the release workflow; empty disables the updater.
    SPARKLE_PUBLIC_KEY: ""
    SPARKLE_FEED_URL: https://github.com/OWNER/cleaner/releases/latest/download/appcast.xml
targets:
  Cleaner:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CleanerKit
        product: CleanerKit
      - target: CleanerWidgets
      - package: Sparkle
        product: Sparkle
    # Config/Cleaner-Info.plist is GENERATED by `xcodegen generate` from the properties below.
    info:
      path: Config/Cleaner-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.prabhatkumar.Cleaner
            CFBundleURLSchemes: [cleaner]
        CleanerAppGroup: $(TeamIdentifierPrefix)com.prabhatkumar.Cleaner
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSServices:
          - NSMenuItem:
              default: Scan with Cleaner
            NSMessage: scanWithCleaner
            NSPortName: Cleaner
            NSSendFileTypes: [public.folder]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner
        CODE_SIGN_ENTITLEMENTS: $(CLEANER_APP_ENTITLEMENTS)
  CleanerWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - Shared
    info:
      path: Config/CleanerWidgets-Info.plist
      properties:
        CFBundleDisplayName: Cleaner Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CleanerAppGroup: $(TeamIdentifierPrefix)com.prabhatkumar.Cleaner
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhatkumar.Cleaner.Widgets
        CODE_SIGN_ENTITLEMENTS: $(CLEANER_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES
schemes:
  Cleaner:
    build:
      targets:
        Cleaner: all
    run:
      config: Debug
    test:
      config: Debug

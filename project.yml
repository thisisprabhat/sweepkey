name: Sweepkey
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SweepkeyKit:
    path: Packages/SweepkeyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly: XcodeGen does not commit a Package.resolved for the generated (ignored)
    # project, so the version is fixed here. Bump deliberately and re-test updates.
    exactVersion: 2.10.1
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.prabhatkumar.Sweepkey
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    CODE_SIGN_STYLE: Automatic
    # Entitlements (App Group, widget sandbox) need a real certificate and team, so they are off
    # for ad-hoc builds. `make build-signed` and scripts/release.sh point these at
    # Config/*.entitlements. The App Group is Team-ID-prefixed
    # ($(TeamIdentifierPrefix)com.prabhatkumar.Sweepkey), which Developer ID builds can use
    # without a provisioning profile; both targets read the resolved id from the
    # SweepkeyAppGroup Info.plist key.
    SWEEPKEY_APP_ENTITLEMENTS: ""
    SWEEPKEY_WIDGET_ENTITLEMENTS: ""
    # Set by the release workflow; empty disables the updater.
    SPARKLE_PUBLIC_KEY: ""
    SPARKLE_FEED_URL: https://github.com/waygosquad/sweepkey/releases/latest/download/appcast.xml
targets:
  Sweepkey:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: SweepkeyKit
        product: SweepkeyKit
      - target: SweepkeyWidgets
      - package: Sparkle
        product: Sparkle
    # Config/Sweepkey-Info.plist is GENERATED by `xcodegen generate` from the properties below.
    info:
      path: Config/Sweepkey-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.prabhatkumar.Sweepkey
            CFBundleURLSchemes: [sweepkey]
        SweepkeyAppGroup: $(TeamIdentifierPrefix)com.prabhatkumar.Sweepkey
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSServices:
          - NSMenuItem:
              default: Scan with Sweepkey
            NSMessage: scanWithSweepkey
            NSPortName: Sweepkey
            NSSendFileTypes: [public.folder]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Sweepkey
        CODE_SIGN_ENTITLEMENTS: $(SWEEPKEY_APP_ENTITLEMENTS)
  SweepkeyWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - Shared
    info:
      path: Config/SweepkeyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Sweepkey Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SweepkeyAppGroup: $(TeamIdentifierPrefix)com.prabhatkumar.Sweepkey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhatkumar.Sweepkey.Widgets
        CODE_SIGN_ENTITLEMENTS: $(SWEEPKEY_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES
schemes:
  Sweepkey:
    build:
      targets:
        Sweepkey: all
    run:
      config: Debug
    test:
      config: Debug

name: Cleaner
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  CleanerKit:
    path: Packages/CleanerKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.prabhatkumar.Cleaner
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    CODE_SIGN_STYLE: Automatic
    # Set by the release workflow; empty disables the updater.
    SPARKLE_PUBLIC_KEY: ""
    SPARKLE_FEED_URL: https://github.com/OWNER/cleaner/releases/latest/download/appcast.xml
targets:
  Cleaner:
    type: application
    platform: macOS
    sources: [App]
    # App/Info.plist is GENERATED by `xcodegen generate` from the properties below
    # (do not edit by hand). It is committed so a plain Xcode checkout builds.
    info:
      path: App/Info.plist
      properties:
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
    dependencies:
      - package: CleanerKit
        product: CleanerKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner
schemes:
  Cleaner:
    build:
      targets:
        Cleaner: all
    run:
      config: Debug
    test:
      config: Debug

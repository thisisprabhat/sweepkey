name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      KEYCHAIN: ${{ github.workspace }}/release.keychain-db
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen

      - name: Import Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials cleaner-notary --keychain "$KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" >/dev/null

      - name: Build CLI
        run: cd Packages/CleanerKit && swift build -c release --product cleaner

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Cleaner.xcodeproj -scheme Cleaner -configuration Release \
            -archivePath build/Cleaner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            archive

      - name: Embed signed CLI in the app and sign standalone CLI
        run: |
          set -euo pipefail
          BIN=$(cd Packages/CleanerKit && swift build -c release --product cleaner --show-bin-path)
          APP=build/Cleaner.xcarchive/Products/Applications/Cleaner.app
          cp "$BIN/cleaner" "$APP/Contents/Resources/cleaner"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
            --sign "Developer ID Application" "$APP/Contents/Resources/cleaner"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
            --sign "Developer ID Application" --preserve-metadata=entitlements "$APP"
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist cli
          cp "$APP/Contents/Resources/cleaner" cli/cleaner
          ditto -c -k cli "dist/cleaner-$VERSION-macos.zip"

      - name: Export with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>developer-id</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Cleaner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/export/Cleaner.app build/Cleaner-notarize.zip
          xcrun notarytool submit build/Cleaner-notarize.zip --keychain-profile cleaner-notary \
            --keychain "$KEYCHAIN" --wait
          xcrun stapler staple build/export/Cleaner.app
          spctl -a -vv build/export/Cleaner.app

      - name: Build, notarize and staple the DMG
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          DMG_SIGN_IDENTITY="Developer ID Application" \
            scripts/make-dmg.sh build/export/Cleaner.app "dist/Cleaner-$VERSION.dmg"
          xcrun notarytool submit "dist/Cleaner-$VERSION.dmg" --keychain-profile cleaner-notary \
            --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "dist/Cleaner-$VERSION.dmg"
          xcrun stapler validate "dist/Cleaner-$VERSION.dmg"

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          # generate_appcast ships with the Sparkle package resolved by xcodebuild.
          TOOL=$(find ~/Library/Developer/Xcode/DerivedData build -path '*Sparkle*' -name generate_appcast -type f 2>/dev/null | head -1)
          if [ -z "$TOOL" ]; then
            curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
            mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
            TOOL="$RUNNER_TEMP/sparkle/bin/generate_appcast"
          fi
          mkdir -p appcast-in && cp "dist/Cleaner-$VERSION.dmg" appcast-in/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOL" --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            -o dist/appcast.xml appcast-in

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "dist/Cleaner-$VERSION.dmg" dist/appcast.xml "dist/cleaner-$VERSION-macos.zip"

      - name: Print cask sha256
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Cask version: $VERSION"
          echo "Cask sha256:  $(shasum -a 256 "dist/Cleaner-$VERSION.dmg" | cut -d' ' -f1)"

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
